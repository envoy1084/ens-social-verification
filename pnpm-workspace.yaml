packages:
  - apps/*
  - packages/*

catalog:
  "@effect/platform-node": 4.0.0-rc.117
  effect: 4.0.0-rc.117
  tsdown: 0.23.0
  tsx: 4.23.15
  vitest: 4.1.11
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  "@types/node": 24.19.0
  klarity: 0.2.0
  lefthook: 2.1.14
  oxfmt: 0.70.0
  oxlint: 1.85.0
  turbo: 2.11.4
  typescript: 7.0.2

allowBuilds:
  esbuild: true
  lefthook: true

autoInstallPeers: false
strictPeerDependencies: true
peerDependencyRules:
  # Redis is only used by the platform's Redis adapter, which this server does not import.
  ignoreMissing:
    - redis
minimumReleaseAgeExclude:
  - "@types/node@24.19.0"
