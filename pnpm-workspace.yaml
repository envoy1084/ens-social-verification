packages:
  - apps/*
  - packages/*

catalog:
  "@effect/sql-pg": 4.0.0-rc.117
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  pg: 8.23.0
  "@types/pg": 8.23.1
  "@ensforge/react": 0.5.0
  "@ensforge/sdk": 0.5.0
  "@ensforge/core": 0.5.0
  "@ensforge/contracts": 0.5.0
  "@fontsource-variable/manrope": 5.3.0
  "@fontsource/instrument-serif": 5.3.0
  "@rainbow-me/rainbowkit": 2.2.11
  "@tanstack/react-query": 5.104.0
  "@tanstack/react-router": 1.170.39
  "@tanstack/router-plugin": 1.168.40
  "@thenamespace/uikit": 0.3.0
  "@tailwindcss/vite": 4.3.3
  "@vitejs/plugin-react": 6.1.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react: 19.2.8
  react-dom: 19.2.8
  scheduler: 0.27.0
  tailwindcss: 4.3.3
  vite: 8.3.1
  viem: 2.56.9
  wagmi: 2.19.5
  "@effect/platform-node": 4.0.0-rc.117
  effect: 4.0.0-rc.117
  tsdown: 0.23.0
  tsx: 4.23.15
  vitest: 4.1.11
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  "@types/node": 24.19.0
  klarity: 0.2.0
  lefthook: 2.1.14
  oxfmt: 0.70.0
  oxlint: 1.85.0
  turbo: 2.11.4
  typescript: 7.0.2

allowBuilds:
  bufferutil: false
  utf-8-validate: false
  keccak: false
  esbuild: true
  lefthook: true

autoInstallPeers: false
patchedDependencies:
  # RC.4 still calls TaggedErrorClass; Effect RC.117 renamed it to TaggedError.
  drizzle-orm@1.0.0-rc.4: patches/drizzle-orm@1.0.0-rc.4.patch
strictPeerDependencies: true
overrides:
  use-sync-external-store: 1.7.0
  # Keep ENSForge's atom adapter on the same Effect RC as the application.
  "@ensforge/react>@effect/atom-react": 4.0.0-rc.117
peerDependencyRules:
  allowedVersions:
    # Wallet connectors include Solana types with a stale compiler peer range.
    typescript: "7"
  # Redis is only used by the platform's Redis adapter, which this server does not import.
  ignoreMissing:
    - redis
minimumReleaseAgeExclude:
  - "@types/node@24.19.0"
  - "@ensforge/contracts@0.5.0"
  - "@ensforge/core@0.5.0"
  - "@ensforge/react@0.5.0"
  - "@ensforge/sdk@0.5.0"
  - "@tanstack/query-core@5.104.0"
  - "@tanstack/react-query@5.104.0"
